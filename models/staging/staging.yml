version: 2

models:
  - name: stg_customers
    description: Cleaned customer data from the customers seed file
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Full name of the customer
        tests:
          - not_null
      - name: customer_country
        description: Country where the customer is located
        tests:
          - not_null

  - name: stg_orders
    description: Cleaned order data from the orders seed file
    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key referencing the customer
        tests:
          - not_null
      - name: product_name
        description: Name of the product ordered
        tests:
          - not_null
      - name: quantity
        description: Number of units ordered
        tests:
          - not_null
      - name: price
        description: Unit price of the product
        tests:
          - not_null
