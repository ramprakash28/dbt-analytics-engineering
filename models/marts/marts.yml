version: 2

models:
  - name: dim_customer
    description: Customer dimension table with one row per customer
    columns:
      - name: customer_key
        description: Unique identifier for each customer
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Full name of the customer
        tests:
          - not_null
      - name: region
        description: Country or region of the customer
        tests:
          - not_null

  - name: dim_product
    description: Product dimension table with one row per unique product
    columns:
      - name: product_key
        description: Surrogate key for each product
        tests:
          - unique
          - not_null
      - name: product_name
        description: Name of the product
        tests:
          - unique
          - not_null
      - name: category
        description: Product category
        tests:
          - not_null

  - name: dim_date
    description: Date dimension table covering all days in 2025
    columns:
      - name: date_key
        description: The date value, used as primary key
        tests:
          - unique
          - not_null
      - name: year
        description: Year extracted from the date
        tests:
          - not_null
      - name: month
        description: Month extracted from the date
        tests:
          - not_null
      - name: day
        description: Day extracted from the date
        tests:
          - not_null

  - name: fact_orders
    description: Fact table containing one row per order with keys to all dimensions
    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - unique
          - not_null
      - name: product_key
        description: Foreign key to dim_product
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: customer_key
        description: Foreign key to dim_customer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: date_key
        description: Foreign key to dim_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: quantity
        description: Number of units ordered
        tests:
          - not_null
      - name: total_amount
        description: Total price for the order line
        tests:
          - not_null
